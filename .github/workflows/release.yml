name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

env:
  SHERPA_VER: v1.10.45
  NDWK_VERSION: 0.1.4

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            sherpa_archive: sherpa-onnx-v1.10.45-linux-x64-shared.tar.bz2
            lib_ext: so
            archive_ext: tar.gz

          - os: ubuntu-24.04-arm
            platform: linux-arm64
            sherpa_archive: sherpa-onnx-v1.10.45-linux-aarch64-shared-cpu.tar.bz2
            lib_ext: so
            archive_ext: tar.gz

          - os: macos-latest
            platform: osx-arm64
            sherpa_archive: sherpa-onnx-v1.10.45-osx-universal2-shared.tar.bz2
            lib_ext: dylib
            archive_ext: tar.gz

          - os: windows-latest
            platform: win-x64
            sherpa_archive: sherpa-onnx-v1.10.45-win-x64-shared.tar.bz2
            lib_ext: dll
            archive_ext: zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Download sherpa-onnx
        shell: bash
        run: |
          mkdir -p Lib/sherpa-onnx
          URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/${{ env.SHERPA_VER }}/${{ matrix.sherpa_archive }}"
          echo "Downloading: ${URL}"
          curl -fSL -o "Lib/${{ matrix.sherpa_archive }}" "${URL}"
          tar --strip-components=1 -xjf "Lib/${{ matrix.sherpa_archive }}" -C Lib/sherpa-onnx

      - name: Download headers
        shell: bash
        run: |
          mkdir -p Lib/sherpa-onnx/include/sherpa-onnx/c-api
          curl -fSL -o Lib/sherpa-onnx/include/sherpa-onnx/c-api/c-api.h "https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/${{ env.SHERPA_VER }}/sherpa-onnx/c-api/c-api.h"
          curl -fSL -o Lib/sherpa-onnx/include/sherpa-onnx/c-api/cxx-api.h "https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/${{ env.SHERPA_VER }}/sherpa-onnx/c-api/cxx-api.h"
          curl -fSL -o Lib/dr_wav.h "https://raw.githubusercontent.com/mackron/dr_libs/master/dr_wav.h"
          curl -fSL -o Lib/miniaudio.h "https://raw.githubusercontent.com/mackron/miniaudio/master/miniaudio.h"
          echo "Verified headers and libraries:"
          ls -la Lib/sherpa-onnx/include/sherpa-onnx/c-api/
          ls -la Lib/sherpa-onnx/lib/

      - name: Build ndwk (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNDWK_PORTABLE=ON
          cmake --build build

      - name: Build ndwk (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -B build -DNDWK_PORTABLE=ON
          cmake --build build --config Release

      - name: Package native libraries (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          STAGING="ndwk-v${{ env.NDWK_VERSION }}-${{ matrix.platform }}"
          mkdir -p "${STAGING}"
          cp build/libndwk.${{ matrix.lib_ext }} "${STAGING}/"
          cp Lib/sherpa-onnx/lib/libsherpa-onnx-c-api.${{ matrix.lib_ext }} "${STAGING}/"
          cp Lib/sherpa-onnx/lib/libonnxruntime*.${{ matrix.lib_ext }} "${STAGING}/" 2>/dev/null || true
          tar -czf "${STAGING}.${{ matrix.archive_ext }}" "${STAGING}/"

      - name: Package native libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ env.NDWK_VERSION }}"
          $staging = "ndwk-v${ver}-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          # Copy ndwk.dll
          $ndwkDll = Get-ChildItem -Path build -Recurse -Filter "ndwk.dll" | Select-Object -First 1
          if ($ndwkDll) { Copy-Item $ndwkDll.FullName -Destination "$staging/" }

          # Copy all DLLs from sherpa-onnx (cargs, onnxruntime, sherpa-onnx-c-api)
          Get-ChildItem "Lib/sherpa-onnx/lib/*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "$staging/"
          Get-ChildItem "Lib/sherpa-onnx/bin/*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "$staging/"

          Compress-Archive -Path "$staging/*" -DestinationPath "$staging.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: ndwk-v${{ env.NDWK_VERSION }}-${{ matrix.platform }}.${{ matrix.archive_ext }}

  create-release:
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f 2>/dev/null || ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}

  publish-nuget:
    needs: [build-native, create-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Place native libraries
        shell: bash
        run: |
          RUNTIMES="bindings/csharp/Ndwk/runtimes"
          VER="${NDWK_VERSION}"

          for plat in linux-x64 linux-arm64 osx-arm64; do
            tar -xzf "artifacts/ndwk-v${VER}-${plat}.tar.gz"
            cp "ndwk-v${VER}-${plat}/"* "${RUNTIMES}/${plat}/native/" 2>/dev/null || true
            rm -f "${RUNTIMES}/${plat}/native/.gitkeep"
          done

          # Windows
          unzip -o "artifacts/ndwk-v${VER}-win-x64.zip" -d win-extract
          cp win-extract/* "${RUNTIMES}/win-x64/native/" 2>/dev/null || true
          rm -f "${RUNTIMES}/win-x64/native/.gitkeep"

      - name: Pack NuGet
        run: dotnet pack bindings/csharp/Ndwk/Ndwk.csproj -c Release -o ./nupkg

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: wakanaharu

      - name: Push to NuGet
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  publish-crate:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        working-directory: bindings/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          NDWK_LIB_DIR: /tmp/ndwk-stub
        run: |
          mkdir -p /tmp/ndwk-stub
          touch /tmp/ndwk-stub/libndwk.so
          cargo publish --allow-dirty
